<!--
  /ai-enquiry/ used to be the AI training enquiry form. Since 26 Nov 2026 it is
  bookings only: anyone who lands here (an old ad, an old link, a bookmark) is
  sent to the booking calendar on /ai-training/, which opens straight away.
  The booking has to happen on /ai-training/ because that is the page that
  records it in the sheet and reports it to Meta (src/assets/js/contact-form.js).

  The query string is carried across so the ad's UTMs still reach the sheet.
  To bring the old form back, run: node scripts/build-ai-contact.js
-->
<script>location.replace("/ai-training/" + location.search + "#book");</script>
<meta http-equiv="refresh" content="0; url=/ai-training/#book">
